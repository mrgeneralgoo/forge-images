name: Container CI

on:
  pull_request:
    paths:
      - '**/Dockerfile'
      - '**/requirements.txt'
      - '**/test.sh'
      - '**/update-*.sh'
      - '**/.dockerignore'
      - '**/NOTICE*'
      - '**/notices/**'
      - '.github/workflows/**'
      - 'LICENSE'
      - 'NOTICE.md'
      - '.github/vulnerability-policy.md'
      - 'renovate.json'

jobs:
  repository-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate Renovate merge policy
        run: |
          set -eu
          # shellcheck disable=SC2016
          policy='
            def protected_packages: [
              "golang",
              "sqlc/sqlc",
              "golangci/golangci-lint",
              "wordpress",
              "library/wordpress",
              "ghcr.io/mrgeneralgoo/frankenphp"
            ];
            . as $config |
            ($config.packageRules[-1] // {}) as $guard |
            $config.platformAutomerge == false and
            $guard.automerge == false and
            $guard.matchManagers == ["dockerfile"] and
            (([$guard | keys[]] -
              ["automerge", "matchManagers", "matchPackageNames"]) | length == 0) and
            ((protected_packages | sort) == (($guard.matchPackageNames // []) | sort))
          '

          check_policy() {
            jq -e "$policy" "$1" >/dev/null
          }
          reject_policy() {
            if check_policy "$1"; then
              echo "Renovate policy contract accepted invalid fixture: $2" >&2
              exit 1
            fi
          }

          check_policy renovate.json

          fixtures=$(mktemp -d)
          trap 'rm -rf "$fixtures"' EXIT

          jq '
            .packageRules |= (
              map(select((.matchPackageNames // []) | index("sqlc/sqlc"))) +
              map(select(((.matchPackageNames // []) | index("sqlc/sqlc")) | not))
            )
          ' renovate.json > "$fixtures/reordered.json"
          reject_policy "$fixtures/reordered.json" "protected rule before automerge rule"

          jq '
            .packageRules |= map(
              if ((.matchPackageNames // []) | index("sqlc/sqlc"))
              then .matchManagers = ["npm"]
              else .
              end
            )
          ' renovate.json > "$fixtures/wrong-manager.json"
          reject_policy "$fixtures/wrong-manager.json" "protected rule with wrong manager"

          jq '
            .packageRules += [{
              "matchManagers": ["dockerfile"],
              "matchPackageNames": ["sqlc/sqlc"],
              "automerge": true
            }]
          ' renovate.json > "$fixtures/later-automerge.json"
          reject_policy "$fixtures/later-automerge.json" "later rule re-enabling automerge"

          jq '
            .packageRules[-1].excludePackageNames = ["sqlc/sqlc"]
          ' renovate.json > "$fixtures/excluded-package.json"
          reject_policy "$fixtures/excluded-package.json" "protected rule excluding a protected package"

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: false

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container: [serversideup, pkm-mcp, openclaw, fava, dae, mapservice-build, wordpress-frankenphp]
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check if Dockerfile changed
        id: check_changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            changed:
              - '${{ matrix.container }}/**'

      - name: Set up Docker Buildx
        if: steps.check_changes.outputs.changed == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build and Test ${{ matrix.container }}
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          echo "Building ${{ matrix.container }}..."
          docker build --platform linux/amd64 -t test-${{ matrix.container }} ./${{ matrix.container }}
          
          echo "Running custom tests for ${{ matrix.container }}..."

          if [ -f "./${{ matrix.container }}/test.sh" ]; then
            chmod +x ./${{ matrix.container }}/test.sh
            ./${{ matrix.container }}/test.sh test-${{ matrix.container }}
          else
            echo "No custom test script found for ${{ matrix.container }}. Performing basic sanity check."
            docker run --rm test-${{ matrix.container }} /bin/true
          fi

  wordpress-frankenphp-arm64:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build and smoke test linux/arm64 WordPress base
        run: |
          docker buildx build --platform linux/arm64 --load \
            -t test-wordpress-frankenphp-arm64 wordpress-frankenphp
          docker run --rm --platform linux/arm64 \
            --entrypoint sh test-wordpress-frankenphp-arm64 -s <<'CHECK'
          set -eu
          php -v | grep -F 'PHP 8.5'
          php -r 'require "/var/www/html/public/wp-includes/version.php"; exit($wp_version === "7.1" ? 0 : 1);'
          test "$(id -u)" -eq 33
          test -d /var/www/html/public/wp-content/uploads
          test -d /var/www/html/public/wp-content/cache
          CHECK
