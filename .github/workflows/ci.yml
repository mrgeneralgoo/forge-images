name: Container CI

on:
  pull_request:
    paths:
      - '**/Dockerfile'
      - '**/requirements.txt'
      - '.github/workflows/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container: [serversideup, pkm-mcp, openclaw, fava, dae]
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check if Dockerfile changed
        id: check_changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            changed:
              - '${{ matrix.container }}/**'

      - name: Set up Docker Buildx
        if: steps.check_changes.outputs.changed == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build and Test ${{ matrix.container }}
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          echo "Building ${{ matrix.container }}..."
          docker build -t test-${{ matrix.container }} ./${{ matrix.container }}
          
          echo "Running custom tests for ${{ matrix.container }}..."

          if [ -f "./${{ matrix.container }}/test.sh" ]; then
            chmod +x ./${{ matrix.container }}/test.sh
            ./${{ matrix.container }}/test.sh test-${{ matrix.container }}
          else
            echo "No custom test script found for ${{ matrix.container }}. Performing basic sanity check."
            docker run --rm test-${{ matrix.container }} /bin/true
          fi
