name: Container CI

on:
  pull_request:

jobs:
  repository-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate image layout and naming
        run: |
          set -Eeuo pipefail
          images=(dae fava mapservice-build wordpress-frankenphp)
          for image in "${images[@]}"; do
            test -f "$image/Dockerfile"
            test -f "$image/.dockerignore"
            test -x "$image/test.sh"
            test -f "$image/README.md"
            test -f ".github/workflows/$image.yml"
            grep -F "image: $image" ".github/workflows/$image.yml" >/dev/null
            grep -F "group: publish-$image" ".github/workflows/$image.yml" >/dev/null
            grep -F 'cancel-in-progress: false' ".github/workflows/$image.yml" >/dev/null
            grep -F 'uses: ./.github/workflows/reusable-publish-image.yml' ".github/workflows/$image.yml" >/dev/null
          done

          test -x .github/scripts/reconcile-public-tags.sh
          test -x .github/scripts/reconcile-publication-history.sh
          test -x .github/scripts/test-reconcile-public-tags.sh
          test -f .github/workflows/reconcile-public-tags.yml

          for removed in openclaw pkm-mcp serversideup; do
            test ! -e "$removed"
            test ! -e ".github/workflows/$removed.yml"
          done

      - name: Validate publication contract
        run: |
          set -Eeuo pipefail
          workflow=.github/workflows/reusable-publish-image.yml
          gha='$'
          for text in \
            'arch: [amd64, arm64]' \
            "outputs: type=image,name=${gha}{{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true" \
            'docker buildx imagetools inspect "$GHCR_IMAGE@$BUILD_DIGEST" --raw' \
            '.platform.os? == $os' \
            '.platform.architecture? == $arch' \
            'vnd.docker.reference.type' \
            "image-ref: ${gha}{{ env.GHCR_IMAGE }}@${gha}{{ steps.resolve.outputs.image_digest }}" \
            "subject-digest: ${gha}{{ steps.resolve.outputs.image_digest }}" \
            "exit-code: '0'" \
            'test "$mirror_digest" = "$IMAGE_DIGEST"' \
            'cosign sign --yes "$GHCR_IMAGE@$IMAGE_DIGEST"' \
            'cosign sign --yes "$DOCKERHUB_IMAGE@$IMAGE_DIGEST"' \
            'test "$canonical_digest" = "$mirror_digest"'; do
            grep -F -- "$text" "$workflow" >/dev/null
          done

          ci_workflow=.github/workflows/ci.yml
          recovery=.github/workflows/reconcile-public-tags.yml
          ci_build=$(sed -n '/^  validate:/,/^  image-validation:/p' "$ci_workflow")
          matrix_script=$(mktemp)
          aggregate_script=$(mktemp)
          ruby - "$workflow" "$ci_workflow" "$matrix_script" "$recovery" "$aggregate_script" <<'RUBY'
          require 'yaml'

          load_workflow = lambda do |path|
            YAML.safe_load(File.read(path), permitted_classes: [], permitted_symbols: [], aliases: true)
          end

          expected_runners = [
            {'arch' => 'amd64', 'runner' => 'ubuntu-latest'},
            {'arch' => 'arm64', 'runner' => 'ubuntu-24.04-arm'}
          ]
          publication = load_workflow.call(ARGV[0])
          platform = publication.fetch('jobs').fetch('build-platform')
          platform_matrix = platform.fetch('strategy').fetch('matrix')
          abort 'invalid publication native runner matrix' unless
            platform_matrix['arch'] == %w[amd64 arm64] && platform_matrix['include'] == expected_runners
          abort 'invalid publication runs-on expression' unless platform.fetch('runs-on') == '$' + '{{ matrix.runner }}'

          swapped = Marshal.load(Marshal.dump(platform_matrix))
          swapped['include'].each do |row|
            row['runner'] = row['arch'] == 'amd64' ? 'ubuntu-24.04-arm' : 'ubuntu-latest'
          end
          abort 'swapped publication runner matrix passed validation' if swapped['include'] == expected_runners

          normalize = ->(value) { value.split.join(' ') }
          reconcile = publication.fetch('jobs').fetch('reconcile-public')
          expected_reconcile_if = "always() && needs.publish-index.result == 'success' && needs.promote-public.result != 'success'"
          abort 'invalid immediate reconciliation condition' unless
            normalize.call(reconcile.fetch('if')) == expected_reconcile_if
          immediate_recovery = lambda do |publish_result, promote_result|
            publish_result == 'success' && promote_result != 'success'
          end
          {
            %w[success success] => false,
            %w[success failure] => true,
            %w[success cancelled] => true,
            %w[failure skipped] => false
          }.each do |results, expected|
            abort "invalid immediate recovery truth table: #{results.join('/')}" unless
              immediate_recovery.call(*results) == expected
          end

          ci = load_workflow.call(ARGV[1])
          jobs = ci.fetch('jobs')
          detect = jobs.fetch('detect-images')
          detect_steps = detect.fetch('steps')
          abort 'detect-images checks out the repository' if
            detect_steps.any? { |step| step['uses']&.start_with?('actions/checkout@') }
          path_filters = detect_steps.select { |step| step['uses']&.start_with?('dorny/paths-filter@') }
          abort 'detect-images must query changed files exactly once' unless path_filters.length == 1
          filters = YAML.safe_load(path_filters.first.fetch('with').fetch('filters'))
          expected_filters = {
            'dae' => ['dae/**', '.github/workflows/dae.yml'],
            'fava' => ['fava/**', '.github/workflows/fava.yml'],
            'mapservice-build' => ['mapservice-build/**', '.github/workflows/mapservice-build.yml'],
            'wordpress-frankenphp' => ['wordpress-frankenphp/**', '.github/workflows/wordpress-frankenphp.yml'],
            'shared-build' => ['.github/workflows/reusable-publish-image.yml', '.github/workflows/ci.yml']
          }
          abort 'invalid changed-files filters' unless filters == expected_filters

          matrix_step = detect_steps.find { |step| step['name'] == 'Build image matrix' }
          abort 'missing dynamic matrix builder' unless matrix_step&.fetch('id') == 'matrix'
          File.write(ARGV[2], matrix_step.fetch('run'))

          validate = jobs.fetch('validate')
          abort 'validate does not depend on detect-images' unless validate.fetch('needs') == 'detect-images'
          abort 'validate does not short-circuit empty matrices' unless
            validate.fetch('if') == "needs.detect-images.outputs.has_images == 'true'"
          abort 'invalid dynamic validation matrix' unless
            validate.fetch('strategy').fetch('matrix') == '$' + '{{ fromJSON(needs.detect-images.outputs.matrix) }}'
          abort 'invalid validation runs-on expression' unless validate.fetch('runs-on') == '$' + '{{ matrix.runner }}'
          abort 'validate repeats changed-files detection' if
            validate.fetch('steps').any? { |step| step['uses']&.start_with?('dorny/paths-filter@') }

          aggregate = jobs.fetch('image-validation')
          abort 'invalid image-validation dependencies' unless aggregate.fetch('needs') == %w[detect-images validate]
          abort 'image-validation must always summarize dependencies' unless aggregate.fetch('if') == 'always()'
          abort 'image-validation must contain one local step' unless
            aggregate.fetch('steps').length == 1 && !aggregate.fetch('steps').first.key?('uses')
          File.write(ARGV[4], aggregate.fetch('steps').first.fetch('run'))

          recovery = load_workflow.call(ARGV[3])
          triggers = recovery['on'] || recovery[true]
          expected_workflows = [
            'Build and publish dae',
            'Build and publish Fava',
            'Build and publish mapservice-build',
            'Build and publish WordPress FrankenPHP'
          ]
          abort 'invalid workflow-run recovery trigger' unless
            triggers.fetch('workflow_run') == {'workflows' => expected_workflows, 'types' => ['completed']}
          abort 'missing scheduled durable recovery' unless triggers.fetch('schedule') == [{'cron' => '17 */6 * * *'}]
          abort 'missing manual recovery trigger' unless triggers.key?('workflow_dispatch')

          resolve = recovery.fetch('jobs').fetch('resolve')
          expected_resolve_if = "(github.event_name == 'workflow_dispatch') || (github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion != 'success')"
          abort 'invalid workflow-run recovery condition' unless
            normalize.call(resolve.fetch('if')) == expected_resolve_if
          workflow_recovery = lambda do |event_name, same_repository, conclusion|
            event_name == 'workflow_dispatch' ||
              (event_name == 'workflow_run' && same_repository && conclusion != 'success')
          end
          [
            ['workflow_dispatch', true, nil, true],
            ['workflow_run', true, 'success', false],
            ['workflow_run', true, 'failure', true],
            ['workflow_run', true, 'cancelled', true],
            ['workflow_run', false, 'failure', false],
            ['schedule', true, nil, false]
          ].each do |event_name, same_repository, conclusion, expected|
            abort "invalid workflow recovery truth table: #{event_name}/#{conclusion}" unless
              workflow_recovery.call(event_name, same_repository, conclusion) == expected
          end
          abort 'scheduled SHA sweep condition changed' unless
            recovery.fetch('jobs').fetch('sweep-sha-history').fetch('if') == "github.event_name == 'schedule'"
          abort 'scheduled latest sweep condition changed' unless
            recovery.fetch('jobs').fetch('sweep-latest').fetch('if') == "github.event_name == 'schedule'"

          %w[dae fava mapservice-build wordpress-frankenphp].each do |image|
            caller = load_workflow.call(File.join(File.dirname(ARGV[0]), "#{image}.yml"))
            caller_triggers = caller['on'] || caller[true]
            expected_paths = [
              "#{image}/**",
              ".github/workflows/#{image}.yml",
              '.github/workflows/reusable-publish-image.yml'
            ]
            abort "invalid publication paths: #{image}" unless
              caller_triggers.fetch('push').fetch('paths') == expected_paths
            abort "missing manual publication trigger: #{image}" unless caller_triggers.key?('workflow_dispatch')
          end
          RUBY

          run_matrix_fixture() {
            local changes=$1 expected_matrix=$2 expected_has_images=$3 output matrix has_images
            output=$(mktemp)
            CHANGED_FILTERS="$changes" GITHUB_OUTPUT="$output" bash "$matrix_script"
            matrix=$(sed -n 's/^matrix=//p' "$output")
            has_images=$(sed -n 's/^has_images=//p' "$output")
            rm -f "$output"
            jq -e --argjson expected "$expected_matrix" '. == $expected' <<<"$matrix" >/dev/null
            test "$has_images" = "$expected_has_images"
          }

          run_matrix_fixture '["wordpress-frankenphp"]' \
            '{"include":[{"image":"wordpress-frankenphp","arch":"amd64","runner":"ubuntu-latest"},{"image":"wordpress-frankenphp","arch":"arm64","runner":"ubuntu-24.04-arm"}]}' true
          run_matrix_fixture '["fava","dae"]' \
            '{"include":[{"image":"dae","arch":"amd64","runner":"ubuntu-latest"},{"image":"dae","arch":"arm64","runner":"ubuntu-24.04-arm"},{"image":"fava","arch":"amd64","runner":"ubuntu-latest"},{"image":"fava","arch":"arm64","runner":"ubuntu-24.04-arm"}]}' true
          run_matrix_fixture '["shared-build"]' \
            '{"include":[{"image":"dae","arch":"amd64","runner":"ubuntu-latest"},{"image":"dae","arch":"arm64","runner":"ubuntu-24.04-arm"},{"image":"fava","arch":"amd64","runner":"ubuntu-latest"},{"image":"fava","arch":"arm64","runner":"ubuntu-24.04-arm"},{"image":"mapservice-build","arch":"amd64","runner":"ubuntu-latest"},{"image":"mapservice-build","arch":"arm64","runner":"ubuntu-24.04-arm"},{"image":"wordpress-frankenphp","arch":"amd64","runner":"ubuntu-latest"},{"image":"wordpress-frankenphp","arch":"arm64","runner":"ubuntu-24.04-arm"}]}' true
          run_matrix_fixture '[]' '{"include":[]}' false

          run_aggregate_fixture() {
            local expected=$1 detect_result=$2 has_images=$3 validate_result=$4 actual
            if DETECT_RESULT="$detect_result" HAS_IMAGES="$has_images" VALIDATE_RESULT="$validate_result" \
              bash "$aggregate_script" >/dev/null 2>&1; then
              actual=success
            else
              actual=failure
            fi
            test "$actual" = "$expected"
          }
          run_aggregate_fixture success success true success
          run_aggregate_fixture success success false skipped
          run_aggregate_fixture failure success true failure
          run_aggregate_fixture failure success true cancelled
          run_aggregate_fixture failure failure false skipped
          run_aggregate_fixture failure success false success
          rm -f "$matrix_script" "$aggregate_script"

          qemu_action=docker/setup-qemu-action
          if grep -Fq "$qemu_action@" "$workflow" || grep -Fq "$qemu_action@" <<<"$ci_build"; then
            echo 'platform build workflow uses QEMU' >&2
            exit 1
          fi

          for text in \
            'uses: docker/build-push-action@' \
            'load: true' \
            'sbom: false' \
            'provenance: false' \
            "type=gha,scope=${gha}{{ matrix.image }}-${gha}{{ matrix.arch }}" \
            "type=gha,scope=ci-${gha}{{ matrix.image }}-${gha}{{ matrix.arch }}" \
            "cache-to: type=gha,mode=max,scope=ci-${gha}{{ matrix.image }}-${gha}{{ matrix.arch }}" \
            "run: ./${gha}{{ matrix.image }}/test.sh test-${gha}{{ matrix.image }}-${gha}{{ matrix.arch }}"; do
            grep -F -- "$text" <<<"$ci_build" >/dev/null
          done
          if grep -Fq "cache-to: type=gha,mode=max,scope=${gha}{{ matrix.image }}-${gha}{{ matrix.arch }}" <<<"$ci_build"; then
            echo 'PR validation writes to the publication cache scope' >&2
            exit 1
          fi

          if grep -Eq 'image-ref:.*steps\.build\.outputs\.digest|subject-digest:.*steps\.build\.outputs\.digest' "$workflow"; then
            echo 'scan or attestation uses a BuildKit index digest' >&2
            exit 1
          fi
          if grep -Eq '^[[:space:]]*continue-on-error:|[|][|][[:space:]]*true' "$workflow"; then
            echo 'publication workflow suppresses operational failures' >&2
            exit 1
          fi
          if grep -Fq "type=image,name=${gha}{{ env.DOCKERHUB_IMAGE }}" "$workflow"; then
            echo 'publication workflow builds separately for both registries' >&2
            exit 1
          fi

          script=.github/scripts/reconcile-public-tags.sh
          history=.github/scripts/reconcile-publication-history.sh
          grep -F 'name: Promote public references with Docker Hub first and GHCR last' "$workflow" >/dev/null
          grep -F 'name: Reconcile/repair public references' "$workflow" >/dev/null
          grep -F "canonical_digest: ${gha}{{ steps.staging.outputs.canonical_digest }}" "$workflow" >/dev/null
          grep -F "mirror_digest: ${gha}{{ steps.staging.outputs.mirror_digest }}" "$workflow" >/dev/null
          test "$(grep -c -F 'run: .github/scripts/reconcile-public-tags.sh' "$workflow")" -eq 2
          grep -F 'RECONCILE_ATTEMPTS' "$script" >/dev/null
          grep -F 'retry ensure_reference_once' "$script" >/dev/null
          grep -F 'ensure_reference "$DOCKERHUB_IMAGE" "$sha_tag" "$target"' "$script" >/dev/null
          grep -F 'ensure_reference "$GHCR_IMAGE" "$sha_tag" "$target"' "$script" >/dev/null
          grep -F 'workflow_run:' "$recovery" >/dev/null
          grep -F 'schedule:' "$recovery" >/dev/null
          grep -F "cron: '17 */6 * * *'" "$recovery" >/dev/null
          grep -F 'workflow_dispatch:' "$recovery" >/dev/null
          grep -F "group: reconcile-sha-${gha}{{ needs.resolve.outputs.image }}-${gha}{{ needs.resolve.outputs.release_sha }}" "$recovery" >/dev/null
          grep -F "group: publish-${gha}{{ matrix.image }}" "$recovery" >/dev/null
          grep -F 'cancel-in-progress: false' "$recovery" >/dev/null
          grep -F 'run: .github/scripts/reconcile-public-tags.sh' "$recovery" >/dev/null
          test "$(grep -c -F 'run: .github/scripts/reconcile-publication-history.sh' "$recovery")" -eq 2
          grep -F 'while :' "$history" >/dev/null
          grep -F 'page=$((page + 1))' "$history" >/dev/null
          grep -F 'per_page=100&page=$page' "$history" >/dev/null
          grep -F 'select(.head_branch == "main" and .status == "completed")' "$history" >/dev/null
          if grep -Eq 'runs\?[^" ]*(branch|status)=' "$history"; then
            echo 'history sweep uses a capped filtered workflow-run query' >&2
            exit 1
          fi
          grep -F 'if [[ "$RECONCILE_MODE" == sha ]]' "$history" >/dev/null
          grep -F 'RECONCILE_DISCOVERY_ONLY' "$history" >/dev/null
          grep -F '1001' .github/scripts/test-reconcile-public-tags.sh >/dev/null

          dockerhub_sha_line=$(grep -n -F 'ensure_reference "$DOCKERHUB_IMAGE" "$sha_tag" "$target"' "$script" | cut -d: -f1)
          ghcr_sha_line=$(grep -n -F 'ensure_reference "$GHCR_IMAGE" "$sha_tag" "$target"' "$script" | cut -d: -f1)
          dockerhub_latest_line=$(grep -n -F 'ensure_reference "$DOCKERHUB_IMAGE" latest "$target"' "$script" | cut -d: -f1)
          ghcr_latest_line=$(grep -n -F 'ensure_reference "$GHCR_IMAGE" latest "$target"' "$script" | cut -d: -f1)
          test "$dockerhub_sha_line" -lt "$ghcr_sha_line"
          test "$ghcr_sha_line" -lt "$dockerhub_latest_line"
          test "$dockerhub_latest_line" -lt "$ghcr_latest_line"

          fixture=$(mktemp)
          trap 'rm -f "$fixture"' EXIT
          cat > "$fixture" <<'JSON'
          {"mediaType":"application/vnd.oci.image.index.v1+json","manifests":[
            {"mediaType":"application/vnd.oci.image.manifest.v1+json","digest":"sha256:image","platform":{"os":"linux","architecture":"amd64"}},
            {"mediaType":"application/vnd.oci.image.manifest.v1+json","digest":"sha256:attestation","platform":{"os":"unknown","architecture":"unknown"},"annotations":{"vnd.docker.reference.type":"attestation-manifest"}}
          ]}
          JSON
          digest=$(jq -er \
            --arg os linux --arg arch amd64 --arg build_digest sha256:build \
            '
              if (.manifests? | type) == "array" then
                [.manifests[] | select(
                  .platform.os? == $os and
                  .platform.architecture? == $arch and
                  (.mediaType? == "application/vnd.oci.image.manifest.v1+json" or
                   .mediaType? == "application/vnd.docker.distribution.manifest.v2+json") and
                  .annotations["vnd.docker.reference.type"]? != "attestation-manifest"
                )]
                | if length == 1 then .[0].digest
                  else error("expected exactly one platform image manifest")
                  end
              elif (.mediaType? == "application/vnd.oci.image.manifest.v1+json" or
                    .mediaType? == "application/vnd.docker.distribution.manifest.v2+json") then
                $build_digest
              else error("expected an OCI index or image manifest") end
            ' "$fixture")
          test "$digest" = sha256:image
          if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'malformed fixture digest passed validation' >&2
            exit 1
          fi
          valid_digest=sha256:$(printf '%064d' 1)
          [[ "$valid_digest" =~ ^sha256:[0-9a-f]{64}$ ]]

      - name: Validate cross-registry promotion repair fixtures
        run: .github/scripts/test-reconcile-public-tags.sh

      - name: Validate action digest pins
        run: |
          set -Eeuo pipefail
          while IFS= read -r use; do
            case "$use" in
              ./*) continue ;;
            esac
            if ! [[ "$use" =~ ^[^@]+@[0-9a-f]{40}$ ]]; then
              echo "unpinned action: $use" >&2
              exit 1
            fi
          done < <(sed -nE 's/^[[:space:]]*- uses: ([^ #]+).*/\1/p' .github/workflows/*.yml)

      - name: Validate Renovate merge policy
        run: |
          set -Eeuo pipefail
          jq -e '
            .platformAutomerge == false and
            .prHourlyLimit == 2 and
            .prConcurrentLimit == 5 and
            any(.packageRules[];
              .matchManagers == ["github-actions"] and
              .groupName == "GitHub Actions") and
            any(.packageRules[];
              .automerge == false and
              .matchManagers == ["dockerfile"] and
              ((.matchPackageNames | sort) == ([
                "golang",
                "golangci/golangci-lint",
                "library/wordpress",
                "serversideup/php",
                "sqlc/sqlc",
                "wordpress"
              ] | sort)))
          ' renovate.json >/dev/null

      - name: Validate vulnerability documentation policy
        run: |
          set -Eeuo pipefail
          grep -F 'Vulnerability findings are informational' .github/vulnerability-policy.md >/dev/null
          grep -F 'operational failures remain fatal' .github/vulnerability-policy.md >/dev/null

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: false

  detect-images:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_images: ${{ steps.matrix.outputs.has_images }}
    steps:
      - name: Detect affected images
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            dae:
              - 'dae/**'
              - '.github/workflows/dae.yml'
            fava:
              - 'fava/**'
              - '.github/workflows/fava.yml'
            mapservice-build:
              - 'mapservice-build/**'
              - '.github/workflows/mapservice-build.yml'
            wordpress-frankenphp:
              - 'wordpress-frankenphp/**'
              - '.github/workflows/wordpress-frankenphp.yml'
            shared-build:
              - '.github/workflows/reusable-publish-image.yml'
              - '.github/workflows/ci.yml'

      - name: Build image matrix
        id: matrix
        env:
          CHANGED_FILTERS: ${{ steps.changes.outputs.changes }}
        run: |
          set -Eeuo pipefail
          jq -e 'type == "array" and all(.[]; type == "string")' <<<"$CHANGED_FILTERS" >/dev/null

          images=(dae fava mapservice-build wordpress-frankenphp)
          selected=()
          if jq -e 'index("shared-build") != null' <<<"$CHANGED_FILTERS" >/dev/null; then
            selected=("${images[@]}")
          else
            for image in "${images[@]}"; do
              if jq -e --arg image "$image" 'index($image) != null' <<<"$CHANGED_FILTERS" >/dev/null; then
                selected+=("$image")
              fi
            done
          fi

          matrix='{"include":[]}'
          for image in "${selected[@]+"${selected[@]}"}"; do
            matrix=$(jq -c --arg image "$image" '.include += [
              {"image": $image, "arch": "amd64", "runner": "ubuntu-latest"},
              {"image": $image, "arch": "arm64", "runner": "ubuntu-24.04-arm"}
            ]' <<<"$matrix")
          done

          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          if ((${#selected[@]} > 0)); then
            printf 'has_images=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'has_images=false\n' >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: detect-images
    if: needs.detect-images.outputs.has_images == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-images.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./${{ matrix.image }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: test-${{ matrix.image }}-${{ matrix.arch }}
          sbom: false
          provenance: false
          cache-from: |
            type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
            type=gha,scope=ci-${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.image }}-${{ matrix.arch }}

      - name: Test image
        run: ./${{ matrix.image }}/test.sh test-${{ matrix.image }}-${{ matrix.arch }}

  image-validation:
    if: always()
    needs: [detect-images, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize image validation
        env:
          DETECT_RESULT: ${{ needs.detect-images.result }}
          HAS_IMAGES: ${{ needs.detect-images.outputs.has_images }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          set -Eeuo pipefail
          test "$DETECT_RESULT" = success
          case "$HAS_IMAGES:$VALIDATE_RESULT" in
            true:success|false:skipped) ;;
            *) echo "unexpected image validation result: $HAS_IMAGES:$VALIDATE_RESULT" >&2; exit 1 ;;
          esac
