name: Build and publish mapservice-build

on:
  push:
    branches:
      - main
    paths:
      - 'mapservice-build/**'
      - 'LICENSE'
      - 'NOTICE.md'
      - '.github/vulnerability-policy.md'
      - '.github/workflows/mapservice-build.yml'
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/mrgeneralgoo/mapservice-build
  DOCKERHUB_IMAGE: docker.io/mrgeneralgoo/mapservice-build

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  build-scan-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.REGISTRY_USERNAME_DOCKER_HUB }}
          password: ${{ secrets.REGISTRY_PASSWORD_DOCKER_HUB }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build and push canonical image by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./mapservice-build
          file: ./mapservice-build/Dockerfile
          platforms: linux/amd64
          build-args: VCS_REF=${{ github.sha }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=mapservice-build
          cache-to: type=gha,mode=max,scope=mapservice-build

      - name: Resolve canonical platform image manifest digest
        id: resolve
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          TARGET_OS: linux
          TARGET_ARCH: amd64
        run: |
          set -Eeuo pipefail
          raw_manifest=$(mktemp)
          trap 'rm -f "$raw_manifest"' EXIT
          docker buildx imagetools inspect "$GHCR_IMAGE@$BUILD_DIGEST" --raw > "$raw_manifest"
          IMAGE_DIGEST="$(
            jq -er \
              --arg os "$TARGET_OS" \
              --arg arch "$TARGET_ARCH" \
              --arg build_digest "$BUILD_DIGEST" \
              '
                if (.manifests? | type) == "array" then
                  [
                    .manifests[]
                    | select(
                        .platform.os? == $os
                        and .platform.architecture? == $arch
                        and (
                          .mediaType? == "application/vnd.oci.image.manifest.v1+json"
                          or .mediaType? == "application/vnd.docker.distribution.manifest.v2+json"
                        )
                        and .annotations["vnd.docker.reference.type"]? != "attestation-manifest"
                      )
                  ]
                  | if length == 1 then .[0].digest
                    else error("expected exactly one platform image manifest")
                    end
                elif (
                  .mediaType? == "application/vnd.oci.image.manifest.v1+json"
                  or .mediaType? == "application/vnd.docker.distribution.manifest.v2+json"
                ) then
                  $build_digest
                else
                  error("expected an OCI index or image manifest")
                end
              ' "$raw_manifest"
          )"
          if ! [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "invalid image manifest digest" >&2
            exit 1
          fi
          printf 'image_digest=%s\n' "$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Block HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # pinned commit
        with:
          image-ref: ${{ env.GHCR_IMAGE }}@${{ steps.resolve.outputs.image_digest }}
          format: sarif
          output: trivy-results.sarif
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln

      - name: Upload vulnerability results
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: trivy-results.sarif

      - name: Extract attached SPDX SBOM
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$GHCR_IMAGE@$BUILD_DIGEST" \
            --format '{{json .SBOM.SPDX}}' > sbom.spdx.json
          jq -e '.spdxVersion | startswith("SPDX-")' sbom.spdx.json

      - name: Attest SPDX SBOM on canonical registry
        uses: actions/attest-sbom@51e74621a501c89df81fc1391c5a8f4cfc9fab2f # v4
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.resolve.outputs.image_digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Attest build provenance on canonical registry
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.resolve.outputs.image_digest }}
          push-to-registry: true

      - name: Mirror scanned image to Docker Hub staging
        env:
          IMAGE_DIGEST: ${{ steps.resolve.outputs.image_digest }}
        run: |
          set -Eeuo pipefail
          staging_tag="staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}-amd64"
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$DOCKERHUB_IMAGE:$staging_tag" \
            "$GHCR_IMAGE@$IMAGE_DIGEST"
          mirror_digest=$(docker buildx imagetools inspect \
            "$DOCKERHUB_IMAGE:$staging_tag" \
            --format '{{json .Manifest}}' | jq -er .digest)
          test "$mirror_digest" = "$IMAGE_DIGEST"

      - name: Install keyless signing tool
        uses: sigstore/cosign-installer@874852de93c66509b01dc7cd80f7a5385182d017 # pinned commit

      - name: Sign canonical and mirror digests
        env:
          IMAGE_DIGEST: ${{ steps.resolve.outputs.image_digest }}
        run: |
          cosign sign --yes "$GHCR_IMAGE@$IMAGE_DIGEST"
          cosign sign --yes "$DOCKERHUB_IMAGE@$IMAGE_DIGEST"

      - name: Create immutable release references
        env:
          IMAGE_DIGEST: ${{ steps.resolve.outputs.image_digest }}
        run: |
          set -Eeuo pipefail
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$GHCR_IMAGE:sha-$GITHUB_SHA" \
            "$GHCR_IMAGE@$IMAGE_DIGEST"
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$DOCKERHUB_IMAGE:sha-$GITHUB_SHA" \
            "$DOCKERHUB_IMAGE@$IMAGE_DIGEST"
          release_digest=$(docker buildx imagetools inspect \
            "$GHCR_IMAGE:sha-$GITHUB_SHA" \
            --format '{{json .Manifest}}' | jq -er .digest)
          mirror_digest=$(docker buildx imagetools inspect \
            "$DOCKERHUB_IMAGE:sha-$GITHUB_SHA" \
            --format '{{json .Manifest}}' | jq -er .digest)
          test "$release_digest" = "$IMAGE_DIGEST"
          test "$mirror_digest" = "$IMAGE_DIGEST"
          test "$release_digest" = "$mirror_digest"

      - name: Update mutable latest references after scan and signing
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE_DIGEST: ${{ steps.resolve.outputs.image_digest }}
        run: |
          docker buildx imagetools create --prefer-index=false --tag "$GHCR_IMAGE:latest" "$GHCR_IMAGE@$IMAGE_DIGEST"
          docker buildx imagetools create --prefer-index=false --tag "$DOCKERHUB_IMAGE:latest" "$DOCKERHUB_IMAGE@$IMAGE_DIGEST"
