name: Build and publish mapservice-build

on:
  push:
    branches: [main]
    paths:
      - 'mapservice-build/**'
      - '.github/workflows/mapservice-build.yml'
      - '.github/workflows/reusable-publish-image.yml'
      - '.github/scripts/reconcile-public-tags.sh'
  workflow_dispatch:

concurrency:
  group: publish-mapservice-build
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  publish:
    uses: ./.github/workflows/reusable-publish-image.yml
    with:
      image: mapservice-build
    secrets:
      REGISTRY_USERNAME_DOCKER_HUB: ${{ secrets.REGISTRY_USERNAME_DOCKER_HUB }}
      REGISTRY_PASSWORD_DOCKER_HUB: ${{ secrets.REGISTRY_PASSWORD_DOCKER_HUB }}
