name: Build and publish WordPress FrankenPHP

on:
  push:
    branches: [main]
    paths:
      - 'wordpress-frankenphp/**'
      - '.github/workflows/wordpress-frankenphp.yml'
      - '.github/workflows/reusable-publish-image.yml'
      - '.github/scripts/reconcile-public-tags.sh'
  workflow_dispatch:

concurrency:
  group: publish-wordpress-frankenphp
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  publish:
    uses: ./.github/workflows/reusable-publish-image.yml
    with:
      image: wordpress-frankenphp
    secrets:
      REGISTRY_USERNAME_DOCKER_HUB: ${{ secrets.REGISTRY_USERNAME_DOCKER_HUB }}
      REGISTRY_PASSWORD_DOCKER_HUB: ${{ secrets.REGISTRY_PASSWORD_DOCKER_HUB }}
