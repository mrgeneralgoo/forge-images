name: Build and publish wordpress-frankenphp

on:
  push:
    branches:
      - main
    paths:
      - 'wordpress-frankenphp/**'
      - 'LICENSE'
      - 'NOTICE.md'
      - '.github/vulnerability-policy.md'
      - '.github/workflows/wordpress-frankenphp.yml'
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/mrgeneralgoo/wordpress-frankenphp
  DOCKERHUB_IMAGE: docker.io/mrgeneralgoo/wordpress-frankenphp

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.resolve.outputs.image_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.REGISTRY_USERNAME_DOCKER_HUB }}
          password: ${{ secrets.REGISTRY_PASSWORD_DOCKER_HUB }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build amd64 and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./wordpress-frankenphp
          file: ./wordpress-frankenphp/Dockerfile
          platforms: linux/amd64
          build-args: VCS_REF=${{ github.sha }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=wordpress-frankenphp-amd64
          cache-to: type=gha,mode=max,scope=wordpress-frankenphp-amd64
      - name: Resolve canonical amd64 image manifest digest
        id: resolve
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          TARGET_OS: linux
          TARGET_ARCH: amd64
        run: |
          set -Eeuo pipefail
          raw_manifest=$(mktemp)
          trap 'rm -f "$raw_manifest"' EXIT
          docker buildx imagetools inspect "$GHCR_IMAGE@$BUILD_DIGEST" --raw > "$raw_manifest"
          IMAGE_DIGEST="$(
            jq -er \
              --arg os "$TARGET_OS" \
              --arg arch "$TARGET_ARCH" \
              --arg build_digest "$BUILD_DIGEST" \
              '
                if (.manifests? | type) == "array" then
                  [
                    .manifests[]
                    | select(
                        .platform.os? == $os
                        and .platform.architecture? == $arch
                        and (
                          .mediaType? == "application/vnd.oci.image.manifest.v1+json"
                          or .mediaType? == "application/vnd.docker.distribution.manifest.v2+json"
                        )
                        and .annotations["vnd.docker.reference.type"]? != "attestation-manifest"
                      )
                  ]
                  | if length == 1 then .[0].digest
                    else error("expected exactly one platform image manifest")
                    end
                elif (
                  .mediaType? == "application/vnd.oci.image.manifest.v1+json"
                  or .mediaType? == "application/vnd.docker.distribution.manifest.v2+json"
                ) then
                  $build_digest
                else
                  error("expected an OCI index or image manifest")
                end
              ' "$raw_manifest"
          )"
          if ! [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "invalid image manifest digest" >&2
            exit 1
          fi
          printf 'image_digest=%s\n' "$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Block HIGH and CRITICAL vulnerabilities on amd64
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # pinned commit
        with:
          image-ref: ${{ env.GHCR_IMAGE }}@${{ steps.resolve.outputs.image_digest }}
          format: sarif
          output: trivy-amd64.sarif
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln
      - name: Upload amd64 vulnerability results
        if: always() && hashFiles('trivy-amd64.sarif') != ''
        uses: github/codeql-action/upload-sarif@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          sarif_file: trivy-amd64.sarif
          category: wordpress-frankenphp-amd64
      - name: Extract attached amd64 SPDX SBOM
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$GHCR_IMAGE@$BUILD_DIGEST" \
            --format '{{json .SBOM.SPDX}}' > sbom-amd64.spdx.json
          jq -e '.spdxVersion | startswith("SPDX-")' sbom-amd64.spdx.json
      - name: Attest amd64 SPDX SBOM on canonical registry
        uses: actions/attest-sbom@51e74621a501c89df81fc1391c5a8f4cfc9fab2f # v4
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.resolve.outputs.image_digest }}
          sbom-path: sbom-amd64.spdx.json
          push-to-registry: true
      - name: Attest amd64 build provenance on canonical registry
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v4
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.resolve.outputs.image_digest }}
          push-to-registry: true
      - name: Mirror scanned amd64 image to Docker Hub staging
        env:
          IMAGE_DIGEST: ${{ steps.resolve.outputs.image_digest }}
        run: |
          set -Eeuo pipefail
          staging_tag="staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}-amd64"
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$DOCKERHUB_IMAGE:$staging_tag" \
            "$GHCR_IMAGE@$IMAGE_DIGEST"
          mirror_digest=$(docker buildx imagetools inspect \
            "$DOCKERHUB_IMAGE:$staging_tag" \
            --format '{{json .Manifest}}' | jq -er .digest)
          test "$mirror_digest" = "$IMAGE_DIGEST"

      - uses: sigstore/cosign-installer@874852de93c66509b01dc7cd80f7a5385182d017 # pinned commit
      - name: Sign amd64 digest
        env:
          IMAGE_DIGEST: ${{ steps.resolve.outputs.image_digest }}
        run: |
          cosign sign --yes "$GHCR_IMAGE@$IMAGE_DIGEST"
          cosign sign --yes "$DOCKERHUB_IMAGE@$IMAGE_DIGEST"

  build-arm64:
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.resolve.outputs.image_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.REGISTRY_USERNAME_DOCKER_HUB }}
          password: ${{ secrets.REGISTRY_PASSWORD_DOCKER_HUB }}
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build arm64 and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./wordpress-frankenphp
          file: ./wordpress-frankenphp/Dockerfile
          platforms: linux/arm64
          build-args: VCS_REF=${{ github.sha }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=wordpress-frankenphp-arm64
          cache-to: type=gha,mode=max,scope=wordpress-frankenphp-arm64
      - name: Resolve canonical arm64 image manifest digest
        id: resolve
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          TARGET_OS: linux
          TARGET_ARCH: arm64
        run: |
          set -Eeuo pipefail
          raw_manifest=$(mktemp)
          trap 'rm -f "$raw_manifest"' EXIT
          docker buildx imagetools inspect "$GHCR_IMAGE@$BUILD_DIGEST" --raw > "$raw_manifest"
          IMAGE_DIGEST="$(
            jq -er \
              --arg os "$TARGET_OS" \
              --arg arch "$TARGET_ARCH" \
              --arg build_digest "$BUILD_DIGEST" \
              '
                if (.manifests? | type) == "array" then
                  [
                    .manifests[]
                    | select(
                        .platform.os? == $os
                        and .platform.architecture? == $arch
                        and (
                          .mediaType? == "application/vnd.oci.image.manifest.v1+json"
                          or .mediaType? == "application/vnd.docker.distribution.manifest.v2+json"
                        )
                        and .annotations["vnd.docker.reference.type"]? != "attestation-manifest"
                      )
                  ]
                  | if length == 1 then .[0].digest
                    else error("expected exactly one platform image manifest")
                    end
                elif (
                  .mediaType? == "application/vnd.oci.image.manifest.v1+json"
                  or .mediaType? == "application/vnd.docker.distribution.manifest.v2+json"
                ) then
                  $build_digest
                else
                  error("expected an OCI index or image manifest")
                end
              ' "$raw_manifest"
          )"
          if ! [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "invalid image manifest digest" >&2
            exit 1
          fi
          printf 'image_digest=%s\n' "$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Block HIGH and CRITICAL vulnerabilities on arm64
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # pinned commit
        with:
          image-ref: ${{ env.GHCR_IMAGE }}@${{ steps.resolve.outputs.image_digest }}
          format: sarif
          output: trivy-arm64.sarif
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln
      - name: Upload arm64 vulnerability results
        if: always() && hashFiles('trivy-arm64.sarif') != ''
        uses: github/codeql-action/upload-sarif@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          sarif_file: trivy-arm64.sarif
          category: wordpress-frankenphp-arm64
      - name: Extract attached arm64 SPDX SBOM
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$GHCR_IMAGE@$BUILD_DIGEST" \
            --format '{{json .SBOM.SPDX}}' > sbom-arm64.spdx.json
          jq -e '.spdxVersion | startswith("SPDX-")' sbom-arm64.spdx.json
      - name: Attest arm64 SPDX SBOM on canonical registry
        uses: actions/attest-sbom@51e74621a501c89df81fc1391c5a8f4cfc9fab2f # v4
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.resolve.outputs.image_digest }}
          sbom-path: sbom-arm64.spdx.json
          push-to-registry: true
      - name: Attest arm64 build provenance on canonical registry
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v4
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.resolve.outputs.image_digest }}
          push-to-registry: true
      - name: Mirror scanned arm64 image to Docker Hub staging
        env:
          IMAGE_DIGEST: ${{ steps.resolve.outputs.image_digest }}
        run: |
          set -Eeuo pipefail
          staging_tag="staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}-arm64"
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$DOCKERHUB_IMAGE:$staging_tag" \
            "$GHCR_IMAGE@$IMAGE_DIGEST"
          mirror_digest=$(docker buildx imagetools inspect \
            "$DOCKERHUB_IMAGE:$staging_tag" \
            --format '{{json .Manifest}}' | jq -er .digest)
          test "$mirror_digest" = "$IMAGE_DIGEST"

      - uses: sigstore/cosign-installer@874852de93c66509b01dc7cd80f7a5385182d017 # pinned commit
      - name: Sign arm64 digest
        env:
          IMAGE_DIGEST: ${{ steps.resolve.outputs.image_digest }}
        run: |
          cosign sign --yes "$GHCR_IMAGE@$IMAGE_DIGEST"
          cosign sign --yes "$DOCKERHUB_IMAGE@$IMAGE_DIGEST"

  publish-index:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.REGISTRY_USERNAME_DOCKER_HUB }}
          password: ${{ secrets.REGISTRY_PASSWORD_DOCKER_HUB }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: sigstore/cosign-installer@874852de93c66509b01dc7cd80f7a5385182d017 # pinned commit
      - name: Create identical non-release staging indexes
        id: staging
        env:
          AMD64_IMAGE_DIGEST: ${{ needs.build-amd64.outputs.image_digest }}
          ARM64_IMAGE_DIGEST: ${{ needs.build-arm64.outputs.image_digest }}
        run: |
          set -Eeuo pipefail
          staging_tag="staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}"
          case "$staging_tag" in staging-*) ;; *) exit 1 ;; esac

          docker buildx imagetools create \
            --tag "$GHCR_IMAGE:$staging_tag" \
            "$GHCR_IMAGE@$AMD64_IMAGE_DIGEST" \
            "$GHCR_IMAGE@$ARM64_IMAGE_DIGEST"
          docker buildx imagetools create \
            --tag "$DOCKERHUB_IMAGE:$staging_tag" \
            "$DOCKERHUB_IMAGE@$AMD64_IMAGE_DIGEST" \
            "$DOCKERHUB_IMAGE@$ARM64_IMAGE_DIGEST"

          canonical_digest=$(docker buildx imagetools inspect \
            "$GHCR_IMAGE:$staging_tag" \
            --format '{{json .Manifest}}' | jq -er .digest)
          mirror_digest=$(docker buildx imagetools inspect \
            "$DOCKERHUB_IMAGE:$staging_tag" \
            --format '{{json .Manifest}}' | jq -er .digest)
          test "$canonical_digest" = "$mirror_digest"
          {
            echo "staging_tag=$staging_tag"
            echo "canonical_digest=$canonical_digest"
            echo "mirror_digest=$mirror_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Attest final multi-architecture index provenance on GHCR
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v4
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.staging.outputs.canonical_digest }}
          push-to-registry: true

      - name: Sign immutable staging index digests
        env:
          CANONICAL_DIGEST: ${{ steps.staging.outputs.canonical_digest }}
          MIRROR_DIGEST: ${{ steps.staging.outputs.mirror_digest }}
        run: |
          set -Eeuo pipefail
          cosign sign --yes "$GHCR_IMAGE@$CANONICAL_DIGEST"
          cosign sign --yes "$DOCKERHUB_IMAGE@$MIRROR_DIGEST"

      - name: Create immutable sha references after all gates
        env:
          CANONICAL_DIGEST: ${{ steps.staging.outputs.canonical_digest }}
          MIRROR_DIGEST: ${{ steps.staging.outputs.mirror_digest }}
        run: |
          set -Eeuo pipefail
          docker buildx imagetools create \
            --tag "$GHCR_IMAGE:sha-$GITHUB_SHA" \
            "$GHCR_IMAGE@$CANONICAL_DIGEST"
          docker buildx imagetools create \
            --tag "$DOCKERHUB_IMAGE:sha-$GITHUB_SHA" \
            "$DOCKERHUB_IMAGE@$MIRROR_DIGEST"

          canonical_release_digest=$(docker buildx imagetools inspect \
            "$GHCR_IMAGE:sha-$GITHUB_SHA" \
            --format '{{json .Manifest}}' | jq -er .digest)
          mirror_release_digest=$(docker buildx imagetools inspect \
            "$DOCKERHUB_IMAGE:sha-$GITHUB_SHA" \
            --format '{{json .Manifest}}' | jq -er .digest)
          test "$canonical_release_digest" = "$CANONICAL_DIGEST"
          test "$mirror_release_digest" = "$MIRROR_DIGEST"
          test "$canonical_release_digest" = "$mirror_release_digest"

      - name: Create latest references on main after sha references
        if: github.ref == 'refs/heads/main'
        env:
          CANONICAL_DIGEST: ${{ steps.staging.outputs.canonical_digest }}
          MIRROR_DIGEST: ${{ steps.staging.outputs.mirror_digest }}
        run: |
          set -Eeuo pipefail
          docker buildx imagetools create \
            --tag "$GHCR_IMAGE:latest" \
            "$GHCR_IMAGE@$CANONICAL_DIGEST"
          docker buildx imagetools create \
            --tag "$DOCKERHUB_IMAGE:latest" \
            "$DOCKERHUB_IMAGE@$MIRROR_DIGEST"
